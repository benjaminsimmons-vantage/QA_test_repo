name: QA Agent - Run Skill

on:
  repository_dispatch:
    types: [run-skill]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run skill
        env:
          CLAUDE_CODE_USE_FOUNDRY: "1"
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ secrets.ANTHROPIC_FOUNDRY_RESOURCE }}
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-6
          ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-4-6
          ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5
          DISABLE_AUTOUPDATER: "1"
        run: |
          claude -p "Run /${{ github.event.client_payload.skill }} on issue #${{ github.event.client_payload.issue_number }}. This is an automated CI run — do not wait for user confirmation. Apply labels, write briefs, publish specs/tickets, and commit code directly." \
            --model opus \
            --dangerously-skip-permissions \
            --output-format json
