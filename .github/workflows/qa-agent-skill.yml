name: QA Agent - Run Skill

on:
  repository_dispatch:
    types: [run-skill]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        if: github.event.client_payload.skill == 'implement'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start app for verification
        if: github.event.client_payload.skill == 'implement'
        run: |
          pip install -r backend/requirements.txt
          cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          cd frontend && npm install && npx vite --port 3000 --host &
          sleep 5
          curl -sf http://localhost:8000/docs > /dev/null && echo "Backend ready"
          curl -sf http://localhost:3000 > /dev/null && echo "Frontend ready"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run skill
        env:
          CLAUDE_CODE_USE_FOUNDRY: "1"
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ secrets.ANTHROPIC_FOUNDRY_RESOURCE }}
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-6
          ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-4-6
          ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5
          DISABLE_AUTOUPDATER: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          claude -p "Run /${{ github.event.client_payload.skill }} on issue #${{ github.event.client_payload.issue_number }}. This is an automated CI run — do not ask the user any questions or wait for confirmation. Follow the skill instructions exactly." \
            --model opus \
            --dangerously-skip-permissions \
            --output-format json
