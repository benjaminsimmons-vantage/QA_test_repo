name: QA Agent - Run Skill

on:
  repository_dispatch:
    types: [run-skill]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Start app
        if: github.event.client_payload.skill == 'implement'
        run: |
          cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          cd frontend && npx vite --port 3000 --host &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/docs > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8000/docs > /dev/null && echo "Backend ready" || echo "Backend failed to start"
          curl -sf http://localhost:3000 > /dev/null && echo "Frontend ready" || echo "Frontend failed to start"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run skill
        env:
          CLAUDE_CODE_USE_FOUNDRY: "1"
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ secrets.ANTHROPIC_FOUNDRY_RESOURCE }}
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-6
          ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-4-6
          ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5
          DISABLE_AUTOUPDATER: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          claude -p "Run /${{ github.event.client_payload.skill }} on issue #${{ github.event.client_payload.issue_number }}. This is an automated CI run — do not ask the user any questions or wait for confirmation. Follow the skill instructions exactly." \
            --model opus \
            --dangerously-skip-permissions \
            --output-format json
